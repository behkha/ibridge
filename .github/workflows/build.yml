name: build

on:
  push:
  workflow_dispatch:

jobs:
  ios:
    # Xcode 26 (iOS 26 SDK): the system tab bar, nav bars and sheets use Liquid Glass on iOS 26+.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen
      - name: Persian font (Vazirmatn, OFL)
        run: |
          for w in Regular Medium SemiBold Bold; do
            curl -fsSL -o "ios/iBridge/Resources/Vazirmatn-$w.ttf" \
              "https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-$w.ttf"
          done
      - name: Generate project
        run: cd ios && xcodegen
      - name: Build for Simulator
        run: |
          xcodebuild -project ios/iBridge.xcodeproj -scheme iBridge -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > sim.log 2>&1 \
            || { grep -E "error:" sim.log | head -40; tail -30 sim.log; exit 1; }
          test -f build/Build/Products/Debug-iphonesimulator/iBridge.app/iBridge
      - name: Screenshots
        run: scripts/ios-screenshots.sh build/Build/Products/Debug-iphonesimulator/iBridge.app screenshots
      # Phase 2 (P2-Calls): Calls with blue call-back icons, and the keypad while calls aren't ready. Same simulator.
      - name: Screenshots (calls)
        run: |
          for s in calls keypad-text; do
            xcrun simctl terminate booted app.ibridge.ios 2>/dev/null || true
            xcrun simctl launch booted app.ibridge.ios -demo "$s" -AppleLanguages "(en)" -AppleLocale en_US
            sleep 6
            xcrun simctl io booted screenshot "screenshots/P2-$s.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: screenshots/
      # Unsigned device build. Sideloadly (or Xcode) signs it with the user's free Apple ID at install time.
      - name: Build unsigned iPhone app (.ipa)
        run: |
          xcodebuild -project ios/iBridge.xcodeproj -scheme iBridge -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > device.log 2>&1 \
            || { grep -E "error:" device.log | head -40; tail -30 device.log; exit 1; }
          mkdir -p Payload && cp -R build-device/Build/Products/Release-iphoneos/iBridge.app Payload/
          zip -qry iBridge-unsigned.ipa Payload
          ls -la iBridge-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: iBridge-unsigned.ipa

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
