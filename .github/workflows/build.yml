name: build

on:
  push:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen
      - name: Persian font (Vazirmatn, OFL)
        run: |
          for w in Regular Medium SemiBold Bold; do
            curl -fsSL -o "ios/iBridge/Resources/Vazirmatn-$w.ttf" \
              "https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-$w.ttf"
          done
      - name: Generate project
        run: cd ios && xcodegen
      - name: Build for Simulator
        run: |
          xcodebuild -project ios/iBridge.xcodeproj -scheme iBridge -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -40
          test -d build/Build/Products/Debug-iphonesimulator/iBridge.app
      - name: Screenshots
        run: scripts/ios-screenshots.sh build/Build/Products/Debug-iphonesimulator/iBridge.app screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: screenshots/

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
