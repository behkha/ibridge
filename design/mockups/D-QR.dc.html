<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wizard: pairing code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D5BD8}a:hover{color:#1546A8}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 48px 24px 32px; background: #FBFBFD; color: #0E1A2B; font-family: 'Roboto', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px">
  <div style="display: flex; align-items: center; gap: 12px">
    <div role="progressbar" aria-valuemin="1" aria-valuemax="6" aria-valuenow="6" aria-label="Step 6 of 6" style="flex: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
      <div style="height: 4px; border-radius: 2px; background: #1D5BD8"></div>
      <div style="height: 4px; border-radius: 2px; background: #1D5BD8"></div>
      <div style="height: 4px; border-radius: 2px; background: #1D5BD8"></div>
      <div style="height: 4px; border-radius: 2px; background: #1D5BD8"></div>
      <div style="height: 4px; border-radius: 2px; background: #1D5BD8"></div>
      <div style="height: 4px; border-radius: 2px; background: #1D5BD8"></div>
    </div>
    <div style="font-size: 14px; color: #5B6472">6 of 6</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 500">Scan with your iPhone</h1>
    <p style="margin: 0; font-size: 16px; line-height: 24px; color: #3F4A5A">Open iBridge on the iPhone and point its camera here.</p>
  </div>

  <div style="align-self: center; padding: 20px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(14, 26, 43, 0.12)">
    <div role="img" aria-label="Pairing QR code" style="display: grid; grid-template-columns: repeat(25, 10px); grid-auto-rows: 10px">
      <sc-for list="{{ cells }}" as="c" hint-placeholder-count="625">
        <div style="background: {{ c }}"></div>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; color: #3F4A5A">
    <svg width="22" height="22" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="none" stroke="#D5D9E0" stroke-width="4"></circle><circle cx="18" cy="18" r="15" fill="none" stroke="#1D5BD8" stroke-width="4" stroke-dasharray="78 94" transform="rotate(-90 18 18)"></circle></svg>
    Waiting for iPhone. New code in 4:12
  </div>

  <div style="margin-top: auto; padding: 14px 16px; border-radius: 16px; background: #EEF0F3; display: flex; align-items: center; gap: 12px">
    <div style="flex: 1; font-size: 15px; color: #3F4A5A">Can’t scan? Type this on the iPhone</div>
    <div dir="ltr" style="font-size: 22px; font-weight: 700; letter-spacing: 2px; font-variant-numeric: tabular-nums">K7Q 29M</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var n = 25, out = [], seed = 7;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    function finder(r, c) {
      var spots = [[0, 0], [0, n - 7], [n - 7, 0]];
      for (var i = 0; i < 3; i++) {
        var y = r - spots[i][0], x = c - spots[i][1];
        if (y >= -1 && y <= 7 && x >= -1 && x <= 7) {
          if (y < 0 || x < 0 || y > 6 || x > 6) return 0;
          if (y === 0 || y === 6 || x === 0 || x === 6) return 1;
          if (y >= 2 && y <= 4 && x >= 2 && x <= 4) return 1;
          return 0;
        }
      }
      return -1;
    }
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        var f = finder(r, c);
        var on = f === -1 ? (r === 6 || c === 6 ? (r + c) % 2 === 0 : rnd() > 0.52) : f === 1;
        out.push(on ? '#0E1A2B' : '#FFFFFF');
      }
    }
    return { cells: out };
  }
}
</script>
</body>
</html>
