<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C Ledger: Everything</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1D5BD8}a:hover{color:#1546A8}
button{font:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; color: #0E1A2B; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 56px 16px 10px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px">
      <h1 style="margin: 0; flex: 1; font-size: 22px; line-height: 28px; font-weight: 700; display: flex; align-items: center; gap: 8px">
        Pixel 8a
        <span aria-label="linked" style="width: 10px; height: 10px; border-radius: 5px; background: #137A4B"></span>
      </h1>
      <button aria-label="Settings" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E1A2B" stroke-width="1.8" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"></path></svg>
      </button>
    </div>
    <label style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px; border-radius: 12px; background: #FFFFFF; color: #6B7380; font-size: 17px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7380" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
      <input aria-label="Search texts, calls and contacts" placeholder="Search texts, calls, people" style="border: 0; background: transparent; font: inherit; color: #0E1A2B; outline: none; flex: 1">
    </label>
    <div role="group" aria-label="Filter" style="display: flex; gap: 8px">
      <button style="height: 32px; padding: 0 14px; border: 0; border-radius: 16px; background: #1D5BD8; color: #FFFFFF; font-size: 14px; font-weight: 600">All</button>
      <button style="height: 32px; padding: 0 14px; border: 0; border-radius: 16px; background: #FFFFFF; color: #0E1A2B; font-size: 14px">Codes</button>
      <button style="height: 32px; padding: 0 14px; border: 0; border-radius: 16px; background: #FFFFFF; color: #0E1A2B; font-size: 14px">Missed</button>
      <button style="height: 32px; padding: 0 14px; border: 0; border-radius: 16px; background: #FFFFFF; color: #0E1A2B; font-size: 14px">Unread</button>
    </div>
  </div>

  <div style="margin: 0 16px 10px; padding: 10px 12px; border-radius: 14px; background: #0E1A2B; color: #FFFFFF; display: flex; align-items: center; gap: 12px">
    <svg width="34" height="34" viewBox="0 0 36 36" aria-label="4 minutes left" role="img"><circle cx="18" cy="18" r="15" fill="none" stroke="#33415A" stroke-width="3"></circle><circle cx="18" cy="18" r="15" fill="none" stroke="#7FA6FF" stroke-width="3" stroke-dasharray="75 94" stroke-linecap="round" transform="rotate(-90 18 18)"></circle></svg>
    <div style="flex: 1; display: flex; flex-direction: column">
      <div style="font-size: 13px; color: #B9C3D3">30004505, 4 min left</div>
      <div style="font-size: 26px; font-weight: 700; letter-spacing: 3px; font-variant-numeric: tabular-nums">482 913</div>
    </div>
    <button style="height: 38px; padding: 0 16px; border: 0; border-radius: 19px; background: #FFFFFF; color: #0E1A2B; font-size: 15px; font-weight: 600">Copy</button>
  </div>

  <div style="flex: 1; margin: 0 16px; border-radius: 14px; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
      <div style="display: flex; align-items: center; gap: 10px; padding: 0 12px; min-height: 54px; border-bottom: 1px solid #EDEFF2">
        <div style="width: 32px; height: 32px; flex: none; border-radius: 9px; background: {{ r.bg }}; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{ r.fg }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ r.icon }}"></path></svg>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
          <div style="font-size: 16px; font-weight: 600; color: {{ r.color }}">{{ r.name }}</div>
          <div style="font-size: 14px; color: #5B6472; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.text }}</div>
        </div>
        <div style="font-size: 14px; color: #6B7380">{{ r.time }}</div>
      </div>
    </sc-for>
  </div>

  <button aria-label="Keypad" style="position: absolute; right: 24px; bottom: 40px; width: 60px; height: 60px; border: 0; border-radius: 30px; background: #1D5BD8; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(29, 91, 216, 0.35)">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 5h.01M12 5h.01M18 5h.01M6 11h.01M12 11h.01M18 11h.01M6 17h.01M12 17h.01M18 17h.01"></path></svg>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var msg = 'M4 5h16v11H9l-5 4z';
    var call = 'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z';
    var ink = '#0E1A2B', red = '#C4001A';
    var M = { bg: '#E8EEFC', fg: '#1D5BD8', icon: msg };
    var C = { bg: '#EDEFF2', fg: '#4A5260', icon: call };
    var X = { bg: '#FCE8EA', fg: '#C4001A', icon: call };
    function row(k, name, text, time, color) { return { bg: k.bg, fg: k.fg, icon: k.icon, name: name, text: text, time: time, color: color || ink }; }
    return {
      rows: [
        row(M, 'Sara Ahmadi', 'I’m outside the building, the blue door…', '14:08'),
        row(X, 'Mom', 'Missed call, SIM 2', '13:55', red),
        row(M, 'Mom', 'Did you eat? Call me when you’re free', '13:41'),
        row(C, 'Sara Ahmadi', 'Incoming, 4 min, SIM 2', '12:30'),
        row(M, 'Reza Karimi', 'Sent the invoice, the transfer should…', '11:20'),
        row(X, '+98 21 8820 4410', 'Missed call, SIM 1', '11:02', red),
        row(C, 'Reza Karimi', 'Outgoing, 1 min, SIM 2', '10:47'),
        row(M, 'Courier', 'Your parcel is out for delivery between…', 'Yesterday')
      ]
    };
  }
}
</script>
</body>
</html>
