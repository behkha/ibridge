<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wizard: texts permission</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D5BD8}a:hover{color:#1546A8}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 48px 24px 32px; background: #FBFBFD; color: #0E1A2B; font-family: 'Roboto', system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px">
  <div style="display: flex; align-items: center; gap: 12px">
    <div role="progressbar" aria-valuemin="1" aria-valuemax="6" aria-valuenow="2" aria-label="Step 2 of 6" style="flex: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
      <div style="height: 4px; border-radius: 2px; background: #1D5BD8"></div>
      <div style="height: 4px; border-radius: 2px; background: #1D5BD8"></div>
      <div style="height: 4px; border-radius: 2px; background: #D5D9E0"></div>
      <div style="height: 4px; border-radius: 2px; background: #D5D9E0"></div>
      <div style="height: 4px; border-radius: 2px; background: #D5D9E0"></div>
      <div style="height: 4px; border-radius: 2px; background: #D5D9E0"></div>
    </div>
    <div style="font-size: 14px; color: #5B6472">2 of 6</div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px">
    <div style="width: 72px; height: 72px; border-radius: 24px; background: #E8EEFC; display: flex; align-items: center; justify-content: center">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#1D5BD8" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path><path d="M8 9h8M8 12h5" stroke-linecap="round"></path></svg>
    </div>
    <h1 style="margin: 0; font-size: 30px; line-height: 38px; font-weight: 500">Texts and codes</h1>
    <p style="margin: 0; font-size: 17px; line-height: 26px; color: #3F4A5A">iBridge reads new texts on this phone and sends them to your iPhone over the encrypted Bluetooth link. Replies you write on the iPhone go out from this SIM.</p>
    <p style="margin: 0; font-size: 15px; line-height: 22px; color: #5B6472">Nothing goes through a server. Only the paired iPhone can read them.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <button style="height: 56px; border: 0; border-radius: 28px; background: #1D5BD8; color: #FFFFFF; font-size: 17px; font-weight: 500">Allow texts</button>
    <button style="height: 48px; border: 0; border-radius: 24px; background: transparent; color: #1D5BD8; font-size: 16px; font-weight: 500">Not now</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
