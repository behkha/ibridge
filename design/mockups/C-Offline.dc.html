<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C Ledger: out of reach</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1D5BD8}a:hover{color:#1546A8}
button{font:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; color: #0E1A2B; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 56px 16px 10px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px">
      <h1 style="margin: 0; flex: 1; font-size: 22px; line-height: 28px; font-weight: 700; display: flex; align-items: center; gap: 8px">
        Pixel 8a
        <span style="height: 24px; padding: 0 10px; border-radius: 12px; background: #FFF1E0; color: #7A3E00; font-size: 13px; font-weight: 600; display: flex; align-items: center">Out of reach</span>
      </h1>
      <button aria-label="Settings" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E1A2B" stroke-width="1.8" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"></path></svg>
      </button>
    </div>
    <label style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px; border-radius: 12px; background: #FFFFFF; color: #6B7380; font-size: 17px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7380" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
      <input aria-label="Search texts, calls and contacts" placeholder="Search texts, calls, people" style="border: 0; background: transparent; font: inherit; color: #0E1A2B; outline: none; flex: 1">
    </label>
    <div role="group" aria-label="Filter" style="display: flex; gap: 8px">
      <button style="height: 32px; padding: 0 14px; border: 0; border-radius: 16px; background: #1D5BD8; color: #FFFFFF; font-size: 14px; font-weight: 600">All</button>
      <button style="height: 32px; padding: 0 14px; border: 0; border-radius: 16px; background: #FFFFFF; color: #0E1A2B; font-size: 14px">Codes</button>
      <button style="height: 32px; padding: 0 14px; border: 0; border-radius: 16px; background: #FFFFFF; color: #0E1A2B; font-size: 14px">Missed</button>
      <button style="height: 32px; padding: 0 14px; border: 0; border-radius: 16px; background: #FFFFFF; color: #0E1A2B; font-size: 14px">Unread</button>
    </div>
  </div>

  <div style="flex: 1; margin: 0 16px; border-radius: 14px; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; opacity: 0.6">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
      <div style="display: flex; align-items: center; gap: 10px; padding: 0 12px; min-height: 54px; border-bottom: 1px solid #EDEFF2">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
          <div style="font-size: 16px; font-weight: 600">{{ r.name }}</div>
          <div style="font-size: 14px; color: #5B6472; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.text }}</div>
        </div>
        <div style="font-size: 14px; color: #6B7380">{{ r.time }}</div>
      </div>
    </sc-for>
  </div>

  <div role="dialog" aria-label="Pixel 8a is out of reach" style="position: absolute; left: 8px; right: 8px; bottom: 8px; padding: 20px 20px 28px; border-radius: 28px; background: #FFFFFF; box-shadow: 0 -4px 24px rgba(14, 26, 43, 0.14); display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 20px; font-weight: 700">Pixel 8a is out of reach</div>
    <div style="font-size: 15px; line-height: 21px; color: #3F4A5A">Last heard from at 14:02. Bring the phones within about 10 metres and iBridge reconnects on its own.</div>
    <button style="height: 50px; border: 0; border-radius: 14px; background: #EEF0F3; color: #0E1A2B; font-size: 17px; font-weight: 600">OK</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { name: 'Sara Ahmadi', text: 'I’m outside the building, the blue door…', time: '14:08' },
        { name: 'Mom', text: 'Missed call, SIM 2', time: '13:55' },
        { name: 'Mom', text: 'Did you eat? Call me when you’re free', time: '13:41' },
        { name: 'Sara Ahmadi', text: 'Incoming, 4 min, SIM 2', time: '12:30' },
        { name: 'Reza Karimi', text: 'Sent the invoice, the transfer should…', time: '11:20' },
        { name: '+98 21 8820 4410', text: 'Missed call, SIM 1', time: '11:02' },
        { name: 'Reza Karimi', text: 'Outgoing, 1 min, SIM 2', time: '10:47' },
        { name: 'Courier', text: 'Your parcel is out for delivery between…', time: 'Yesterday' }
      ]
    };
  }
}
</script>
</body>
</html>
