<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A Companion: Calls, out of reach</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1D5BD8}a:hover{color:#1546A8}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #0E1A2B; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 58px 16px 8px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: flex-end">
      <button aria-label="Pixel 8a out of reach" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 10px; border: 0; border-radius: 16px; background: #EEF0F3; color: #4A5260; font-size: 14px; font-weight: 600">
        <svg width="30" height="12" viewBox="0 0 30 12" aria-hidden="true"><circle cx="5" cy="6" r="4" fill="none" stroke="#6B7380" stroke-width="2"></circle><line x1="9" y1="6" x2="13" y2="6" stroke="#6B7380" stroke-width="2"></line><line x1="17" y1="6" x2="21" y2="6" stroke="#6B7380" stroke-width="2"></line><circle cx="25" cy="6" r="4" fill="none" stroke="#6B7380" stroke-width="2"></circle></svg>
        Out of reach
      </button>
    </div>
    <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700">Calls</h1>
    <div role="group" aria-label="Filter" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 2px; border-radius: 9px; background: #EEF0F3">
      <button style="height: 30px; border: 0; border-radius: 7px; background: #FFFFFF; font-size: 14px; font-weight: 600; color: #0E1A2B">All</button>
      <button style="height: 30px; border: 0; border-radius: 7px; background: transparent; font-size: 14px; color: #0E1A2B">Missed</button>
    </div>
  </div>

  <div role="status" style="margin: 4px 16px 6px; padding: 10px 12px; border-radius: 12px; background: #FFF1E0; color: #7A3E00; font-size: 15px; line-height: 20px; display: flex; gap: 10px; align-items: center">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A65300" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 8v5M12 16.5h.01M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
    <div style="flex: 1">Pixel 8a is out of reach since 14:02. Calling needs it nearby.</div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="7">
      <div style="display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 60px">
        <div style="flex: 1; min-width: 0; border-bottom: 1px solid #E3E6EB; padding: 9px 0; display: flex; align-items: center; gap: 10px">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
            <div style="font-size: 17px; font-weight: 600; color: {{ r.color }}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.name }}</div>
            <div style="font-size: 14px; color: #6B7380">{{ r.kind }}</div>
          </div>
          <div style="font-size: 15px; color: #6B7380">{{ r.time }}</div>
          <button disabled aria-label="Call back, unavailable while out of reach" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: #B4BAC4; display: flex; align-items: center; justify-content: center">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z"></path></svg>
          </button>
        </div>
      </div>
    </sc-for>
  </div>

  <nav aria-label="Tabs" style="height: 83px; box-sizing: border-box; padding-top: 7px; border-top: 1px solid #E3E6EB; background: #F9FAFB; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
      <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: {{ t.color }}; font-size: 11px; font-weight: 500">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ t.path }}"></path></svg>
        {{ t.label }}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var on = '#1D5BD8', off = '#7A8291', red = '#C4001A', ink = '#0E1A2B';
    var P = {
      msg: 'M4 5h16v11H9l-5 4z',
      call: 'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z',
      pad: 'M6 5h.01M12 5h.01M18 5h.01M6 11h.01M12 11h.01M18 11h.01M6 17h.01M12 17h.01M18 17h.01',
      person: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',
      gear: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z'
    };
    return {
      rows: [
        { name: 'Mom (2)', kind: 'Missed, SIM 2', time: '13:55', color: red },
        { name: 'Sara Ahmadi', kind: 'Incoming, SIM 2', time: '12:30', color: ink },
        { name: '+98 21 8820 4410', kind: 'Missed, SIM 1', time: '11:02', color: red },
        { name: 'Reza Karimi', kind: 'Outgoing, SIM 2', time: '10:47', color: ink },
        { name: 'Courier', kind: 'Incoming, SIM 1', time: 'Yesterday', color: ink },
        { name: 'Neda Jafari', kind: 'Outgoing, SIM 2', time: 'Yesterday', color: ink },
        { name: 'Dr. Moradi Clinic', kind: 'Incoming, SIM 1', time: 'Saturday', color: ink }
      ],
      tabs: [
        { label: 'Messages', path: P.msg, color: off },
        { label: 'Calls', path: P.call, color: on },
        { label: 'Keypad', path: P.pad, color: off },
        { label: 'Contacts', path: P.person, color: off },
        { label: 'Settings', path: P.gear, color: off }
      ]
    };
  }
}
</script>
</body>
</html>
