<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B Tether: Messages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1D5BD8}a:hover{color:#1546A8}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #0E1A2B; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div role="status" style="padding: 56px 16px 14px; background: #E6F4EC; color: #0F4D31; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="40" height="14" viewBox="0 0 40 14" aria-hidden="true"><circle cx="6" cy="7" r="5" fill="#137A4B"></circle><line x1="11" y1="7" x2="29" y2="7" stroke="#137A4B" stroke-width="2.5"></line><circle cx="34" cy="7" r="5" fill="#137A4B"></circle></svg>
      <div style="flex: 1; font-size: 15px; font-weight: 600">Linked to Pixel 8a</div>
      <div style="font-size: 14px">Battery 62%</div>
      <div style="font-size: 14px">Irancell</div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: #FFFFFF">
      <div style="flex: 1; display: flex; flex-direction: column">
        <div style="font-size: 13px; color: #3F4A5A">New code from 30004505</div>
        <div style="font-size: 28px; font-weight: 700; letter-spacing: 3px; font-variant-numeric: tabular-nums; color: #0E1A2B">482 913</div>
      </div>
      <button style="height: 40px; padding: 0 18px; border: 0; border-radius: 20px; background: #137A4B; color: #FFFFFF; font-size: 16px; font-weight: 600">Copy</button>
    </div>
  </div>

  <div style="padding: 14px 16px 6px; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700">Messages</h1>
    <div role="group" aria-label="Filter" style="display: flex; gap: 8px">
      <button style="height: 32px; padding: 0 14px; border: 0; border-radius: 16px; background: #0E1A2B; color: #FFFFFF; font-size: 14px; font-weight: 600">All</button>
      <button style="height: 32px; padding: 0 14px; border: 1px solid #D5D9E0; border-radius: 16px; background: #FFFFFF; color: #0E1A2B; font-size: 14px">Codes 3</button>
      <button style="height: 32px; padding: 0 14px; border: 1px solid #D5D9E0; border-radius: 16px; background: #FFFFFF; color: #0E1A2B; font-size: 14px">Unread 3</button>
    </div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
      <div style="display: flex; gap: 12px; padding: 10px 16px 0">
        <div style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: {{ r.tint }}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">{{ r.initials }}</div>
        <div style="flex: 1; min-width: 0; border-bottom: 1px solid #E3E6EB; padding-bottom: 10px; display: flex; flex-direction: column; gap: 2px">
          <div style="display: flex; align-items: baseline; gap: 8px">
            <div style="flex: 1; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.name }}</div>
            <div style="font-size: 15px; color: #6B7380">{{ r.time }}</div>
          </div>
          <div style="font-size: 15px; line-height: 20px; color: #5B6472; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{ r.text }}</div>
        </div>
      </div>
    </sc-for>
  </div>

  <nav aria-label="Tabs" style="height: 83px; box-sizing: border-box; padding-top: 7px; border-top: 1px solid #E3E6EB; background: #F9FAFB; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
      <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: {{ t.color }}; font-size: 10px; font-weight: 500">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ t.path }}"></path></svg>
        {{ t.label }}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var on = '#137A4B', off = '#7A8291';
    var P = {
      msg: 'M4 5h16v11H9l-5 4z',
      call: 'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z',
      pad: 'M6 5h.01M12 5h.01M18 5h.01M6 11h.01M12 11h.01M18 11h.01M6 17h.01M12 17h.01M18 17h.01',
      person: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',
      gear: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z'
    };
    return {
      rows: [
        { initials: 'SA', tint: '#5E6AD2', name: 'Sara Ahmadi', time: '14:08', text: 'I’m outside the building, the blue door next to the pharmacy' },
        { initials: 'M', tint: '#C2569B', name: 'Mom', time: '13:41', text: 'Did you eat? Call me when you’re free' },
        { initials: 'RK', tint: '#2E8C83', name: 'Reza Karimi', time: '11:20', text: 'Sent the invoice, the transfer should land tomorrow morning' },
        { initials: 'CO', tint: '#B0702A', name: 'Courier', time: 'Yesterday', text: 'Your parcel is out for delivery between 16:00 and 19:00' },
        { initials: 'NJ', tint: '#6A7B2E', name: 'Neda Jafari', time: 'Yesterday', text: 'Haha yes, see you Thursday' }
      ],
      tabs: [
        { label: 'Messages', path: P.msg, color: on },
        { label: 'Calls', path: P.call, color: off },
        { label: 'Keypad', path: P.pad, color: off },
        { label: 'Contacts', path: P.person, color: off },
        { label: 'Settings', path: P.gear, color: off }
      ]
    };
  }
}
</script>
</body>
</html>
