<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A Companion: Messages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1D5BD8}a:hover{color:#1546A8}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #0E1A2B; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 58px 16px 8px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: flex-end">
      <button aria-label="Linked to Pixel 8a, encrypted" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 10px; border: 0; border-radius: 16px; background: #E6F4EC; color: #0F5E3A; font-size: 14px; font-weight: 600">
        <svg width="30" height="12" viewBox="0 0 30 12" aria-hidden="true"><circle cx="5" cy="6" r="4" fill="#137A4B"></circle><line x1="9" y1="6" x2="21" y2="6" stroke="#137A4B" stroke-width="2"></line><circle cx="25" cy="6" r="4" fill="#137A4B"></circle></svg>
        Pixel 8a
      </button>
    </div>
    <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.2px">Messages</h1>
    <label style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 8px; border-radius: 10px; background: #EEF0F3; color: #6B7380; font-size: 17px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7380" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
      <input aria-label="Search" placeholder="Search" style="border: 0; background: transparent; font: inherit; color: #0E1A2B; outline: none; flex: 1">
    </label>
  </div>

  <div style="margin: 6px 16px 10px; padding: 14px 16px; border-radius: 16px; background: #F1F5FE; display: flex; align-items: center; gap: 12px">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 13px; color: #3F4A5A">Code from 30004505, just now</div>
      <div style="font-size: 32px; font-weight: 700; letter-spacing: 3px; font-variant-numeric: tabular-nums; color: #0E1A2B">482 913</div>
    </div>
    <button style="height: 40px; padding: 0 18px; border: 0; border-radius: 20px; background: #1D5BD8; color: #FFFFFF; font-size: 16px; font-weight: 600">Copy</button>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
      <div style="display: flex; gap: 12px; padding: 10px 16px 0">
        <div style="width: 48px; height: 48px; flex: none; border-radius: 24px; background: {{ r.tint }}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600">{{ r.initials }}</div>
        <div style="flex: 1; min-width: 0; border-bottom: 1px solid #E3E6EB; padding-bottom: 10px; display: flex; flex-direction: column; gap: 2px">
          <div style="display: flex; align-items: baseline; gap: 8px">
            <div style="flex: 1; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.name }}</div>
            <div style="font-size: 15px; color: #6B7380">{{ r.time }}</div>
          </div>
          <div style="display: flex; gap: 8px; align-items: flex-start">
            <div style="flex: 1; font-size: 15px; line-height: 20px; color: #5B6472; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{ r.text }}</div>
            <sc-if value="{{ r.unread }}" hint-placeholder-val="{{ true }}">
              <div style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #1D5BD8; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{ r.unread }}</div>
            </sc-if>
          </div>
        </div>
      </div>
    </sc-for>
  </div>

  <nav aria-label="Tabs" style="height: 83px; box-sizing: border-box; padding-top: 7px; border-top: 1px solid #E3E6EB; background: #F9FAFB; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
      <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: {{ t.color }}; font-size: 11px; font-weight: 500">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ t.path }}"></path></svg>
        {{ t.label }}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var on = '#1D5BD8', off = '#7A8291';
    var P = {
      msg: 'M4 5h16v11H9l-5 4z',
      call: 'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z',
      pad: 'M6 5h.01M12 5h.01M18 5h.01M6 11h.01M12 11h.01M18 11h.01M6 17h.01M12 17h.01M18 17h.01',
      person: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',
      gear: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z'
    };
    return {
      rows: [
        { initials: 'SA', tint: '#5E6AD2', name: 'Sara Ahmadi', time: '14:08', text: 'I’m outside the building, the blue door next to the pharmacy', unread: 2 },
        { initials: '30', tint: '#8A93A3', name: '30004505', time: '14:07', text: 'Your login code is 482913. Do not share it with anyone.', unread: 0 },
        { initials: 'M', tint: '#C2569B', name: 'Mom', time: '13:41', text: 'Did you eat? Call me when you’re free', unread: 1 },
        { initials: 'RK', tint: '#2E8C83', name: 'Reza Karimi', time: '11:20', text: 'Sent the invoice, the transfer should land tomorrow morning', unread: 0 },
        { initials: 'CO', tint: '#B0702A', name: 'Courier', time: 'Yesterday', text: 'Your parcel is out for delivery between 16:00 and 19:00', unread: 0 },
        { initials: 'NJ', tint: '#6A7B2E', name: 'Neda Jafari', time: 'Yesterday', text: 'Haha yes, see you Thursday', unread: 0 }
      ],
      tabs: [
        { label: 'Messages', path: P.msg, color: on },
        { label: 'Calls', path: P.call, color: off },
        { label: 'Keypad', path: P.pad, color: off },
        { label: 'Contacts', path: P.person, color: off },
        { label: 'Settings', path: P.gear, color: off }
      ]
    };
  }
}
</script>
</body>
</html>
